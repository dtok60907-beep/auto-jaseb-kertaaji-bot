[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-engine-telethon-spike"
version = "0.1.0"
description = "Isolated Telethon adapter for the Telegram engine benchmark"
requires-python = ">=3.11,<3.15"
dependencies = [
  "Telethon==1.44.0",
]

[tool.setuptools]
py-modules = ["adapter"]

[tool.unittest]
start-directory = "tests"
