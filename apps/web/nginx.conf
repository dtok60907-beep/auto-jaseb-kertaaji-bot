server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets (index-<hash>.js/css) are safe to cache forever --
  # a new deploy always ships a new filename.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html and config.js are the only things a Telegram Mini App
  # WebView re-checks between deploys (the hashed asset filenames live
  # inside them) -- without an explicit no-store, aggressive WebView
  # caching can keep serving a stale index.html indefinitely and a new
  # deploy silently never reaches the client.
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  location = /config.js {
    add_header Cache-Control "no-store" always;
  }

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    default_type application/json;
    return 200 '{"status":"alive"}';
  }
}
